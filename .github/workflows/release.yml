name: Release build

# A published GitHub release is built and proven installable: the tag must
# equal the pyproject version, the suite runs, the distribution is checked
# with `twine check --strict`, the wheel is installed into a clean
# environment and run, and the files are attached to the workflow run.
#
# Nothing is uploaded to PyPI. The name `mandate` there belongs to an
# unrelated project and this one's name is still being decided; publishing
# comes as its own change, through Trusted Publishing, once it is. No API
# token is ever to live in this repository or its secrets.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag is the version being shipped
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, sys, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["TAG"]
          if tag != f"v{version}":
              sys.exit(f"release tag {tag!r} does not match pyproject version v{version}")
          print(f"building v{version}")
          PY

      - name: Run the gate suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp]" pytest
          python -m pytest tests/ -q

      - name: Build and check the distribution
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Install the wheel into a clean environment and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/mandate --help > /dev/null
          /tmp/clean/bin/mandate demo

      - name: Keep the built files
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
