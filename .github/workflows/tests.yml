name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install "ruff==0.15.8"

      - name: Lint
        run: ruff check . --output-format github

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp]" pytest

      - name: Run the gate suite
        run: python -m pytest tests/ -q

      - name: Run the demo scenario
        run: python -m mandate demo

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t mandate:ci .

      - name: It runs as uid 10001, not root
        run: test "$(docker run --rm --entrypoint id mandate:ci -u)" = "10001"

      - name: The gateway serves from a mounted configuration
        run: |
          mkdir smoke
          cat > smoke/gateway.json <<'JSON'
          {"store": "store", "auth": {"kind": "api_keys"},
           "routes": [{"audience": "mandate://ci", "base_url": "https://erp.example.com",
                       "allowed_methods": ["POST"], "allowed_paths": ["/orders"]}]}
          JSON
          chmod -R a+rwX smoke
          docker run -d --name mandate -p 8080:8080 -v "$PWD/smoke:/data" mandate:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/health && break; sleep 1; done
          curl -fsS localhost:8080/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/v1/intents -d '{}')" = "401"

      - name: Logs
        if: always()
        run: docker logs mandate || true
