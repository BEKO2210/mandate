[project]
name = "mandate"
version = "0.8.1"
description = "Enforcement gateway for AI-agent grants and execution"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Belkis Aslani" }, { name = "Mandate Labs" }]
dependencies = ["cryptography>=41", "fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.27"]

[project.optional-dependencies]
mcp = ["mcp>=2.0", "anyio>=4"]

[project.scripts]
mandate = "mandate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mandate*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# ruff's defaults, written down so a ruff upgrade cannot change what CI enforces.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
filterwarnings = [
    # Ours fail the suite: a deprecation in this package is a bug with a date.
    "error::DeprecationWarning:mandate.*",
    # Starlette's TestClient touching an anyio alias; not ours to fix.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
