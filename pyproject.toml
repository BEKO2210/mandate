[project]
name = "mandate"
version = "0.2.2"
description = "Enforcement gateway for AI-agent grants and execution"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Belkis Aslani" }, { name = "Mandate Labs" }]
dependencies = ["cryptography>=41", "fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.27"]

[project.scripts]
mandate = "mandate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mandate*"]
